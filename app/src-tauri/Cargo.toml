[package]
name = "efinity-facecam"
version = "0.2.0"
description = "Efinity FaceCam — PCOB debugger-based observer utility for Free Fire"
authors = ["themisuwu"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Debugger file watching + parsing
notify = "6"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
regex = "1"
once_cell = "1"

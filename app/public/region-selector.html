<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Region</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e1a;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  #container {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
  }

  #capture-img {
    max-width: 100%;
    max-height: calc(100vh - 60px);
    object-fit: contain;
    display: block;
    cursor: crosshair;
    -webkit-user-drag: none;
  }

  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  #selection {
    position: absolute;
    border: 2px solid #60a5fa;
    background: rgba(96, 165, 250, 0.15);
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
    display: none;
    pointer-events: none;
    z-index: 10;
  }

  #selection .dimension-label {
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    background: #60a5fa;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }

  #toolbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 52px;
    background: rgba(10, 14, 26, 0.95);
    border-top: 1px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 0 20px;
    z-index: 100;
    backdrop-filter: blur(10px);
  }

  #toolbar .info {
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    margin-right: auto;
  }

  #toolbar .info strong {
    color: rgba(255,255,255,0.8);
  }

  .btn {
    height: 34px;
    padding: 0 20px;
    border: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }

  .btn-confirm {
    background: #22c55e;
    color: #fff;
  }
  .btn-confirm:hover { background: #16a34a; }
  .btn-confirm:disabled {
    background: rgba(34, 197, 94, 0.3);
    color: rgba(255,255,255,0.4);
    cursor: not-allowed;
  }

  .btn-cancel {
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7);
  }
  .btn-cancel:hover { background: rgba(255,255,255,0.15); }

  .btn-reset {
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.5);
  }
  .btn-reset:hover { background: rgba(255,255,255,0.1); }

  #loading {
    color: rgba(255,255,255,0.5);
    font-size: 14px;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
</style>
</head>
<body>

<div id="container">
  <div id="loading">Capturing image...</div>
  <img id="capture-img" style="display:none;" draggable="false" />
  <div id="selection">
    <div class="dimension-label" id="dim-label"></div>
  </div>
</div>

<div id="toolbar">
  <span class="info" id="info-text">Draw a rectangle on the image to select the capture region</span>
  <button class="btn btn-reset" id="btn-reset" style="display:none;" onclick="resetSelection()">Reset</button>
  <button class="btn btn-cancel" onclick="cancelSelection()">Cancel</button>
  <button class="btn btn-confirm" id="btn-confirm" disabled onclick="submitSelection()">Confirm</button>
</div>

<script type="module">
  // Use Tauri's injected global APIs (works for static HTML pages in public/)
  const loading = document.getElementById('loading');

  window.onerror = function(msg, url, line) {
    if (loading) loading.textContent = 'Err: ' + msg + ' (L' + line + ')';
  };

  try {
    const { invoke } = window.__TAURI__.core;
    const { getCurrentWindow } = window.__TAURI__.window;
    window._invoke = invoke;
    window._getCurrentWindow = getCurrentWindow;
  } catch (err) {
    loading.textContent = 'API Error: ' + err.message;
  }

  const img = document.getElementById('capture-img');
  const selection = document.getElementById('selection');
  const dimLabel = document.getElementById('dim-label');
  const infoText = document.getElementById('info-text');
  const btnConfirm = document.getElementById('btn-confirm');
  const btnReset = document.getElementById('btn-reset');

  let drawing = false;
  let startX = 0, startY = 0;
  let selRect = { x: 0, y: 0, w: 0, h: 0 };
  let hasSelection = false;

  // Image display scale factors (image pixels -> screen pixels)
  let scaleX = 1, scaleY = 1;
  let imgOffsetX = 0, imgOffsetY = 0;
  let origWidth = 0, origHeight = 0;

  // ── Load the captured screenshot ──
  async function init() {
    try {
      const data = await window._invoke('get_region_selector_image');
      if (!data || !data.image) {
        loading.textContent = 'No image available';
        return;
      }

      origWidth = data.original_width;
      origHeight = data.original_height;

      img.onload = () => {
        loading.style.display = 'none';
        img.style.display = 'block';
        updateScale();
      };
      img.src = 'data:image/jpeg;base64,' + data.image;
    } catch (e) {
      loading.textContent = 'Error: ' + e;
    }
  }

  function updateScale() {
    const rect = img.getBoundingClientRect();
    const imgAspect = origWidth / origHeight;
    const containerAspect = rect.width / rect.height;
    
    let renderW, renderH, renderX, renderY;
    
    if (imgAspect > containerAspect) {
      // Image is wider than container constraints
      renderW = rect.width;
      renderH = rect.width / imgAspect;
      renderX = rect.left;
      renderY = rect.top + (rect.height - renderH) / 2;
    } else {
      // Image is taller than container constraints
      renderH = rect.height;
      renderW = rect.height * imgAspect;
      renderX = rect.left + (rect.width - renderW) / 2;
      renderY = rect.top;
    }
    
    scaleX = origWidth / renderW;
    scaleY = origHeight / renderH;
    imgOffsetX = renderX;
    imgOffsetY = renderY;
    
    window.renderRect = {
      left: renderX,
      right: renderX + renderW,
      top: renderY,
      bottom: renderY + renderH,
      width: renderW,
      height: renderH
    };
  }

  // ── Mouse events for drawing selection ──
  document.addEventListener('mousedown', (e) => {
    if (e.target !== img && !e.target.closest('#container')) return;
    if (e.target.closest('#toolbar')) return;

    updateScale();

    const mx = e.clientX - imgOffsetX;
    const my = e.clientY - imgOffsetY;

    // Ignore clicks outside the image
    const imgRect = window.renderRect;
    if (e.clientX < imgRect.left || e.clientX > imgRect.right ||
        e.clientY < imgRect.top || e.clientY > imgRect.bottom) return;


    drawing = true;
    startX = e.clientX;
    startY = e.clientY;

    selection.style.display = 'block';
    selection.style.left = startX + 'px';
    selection.style.top = startY + 'px';
    selection.style.width = '0px';
    selection.style.height = '0px';
    dimLabel.textContent = '';
  });

  document.addEventListener('mousemove', (e) => {
    if (!drawing) return;

    const imgRect = window.renderRect;

    // Clamp to image bounds
    const cx = Math.max(imgRect.left, Math.min(e.clientX, imgRect.right));
    const cy = Math.max(imgRect.top, Math.min(e.clientY, imgRect.bottom));
    const sx = Math.max(imgRect.left, Math.min(startX, imgRect.right));
    const sy = Math.max(imgRect.top, Math.min(startY, imgRect.bottom));

    const left = Math.min(sx, cx);
    const top = Math.min(sy, cy);
    const width = Math.abs(cx - sx);
    const height = Math.abs(cy - sy);

    selection.style.left = left + 'px';
    selection.style.top = top + 'px';
    selection.style.width = width + 'px';
    selection.style.height = height + 'px';

    // Show real pixel dimensions
    const realW = Math.round(width * scaleX);
    const realH = Math.round(height * scaleY);
    dimLabel.textContent = realW + ' x ' + realH;
  });

  document.addEventListener('mouseup', (e) => {
    if (!drawing) return;
    drawing = false;

    const imgRect = window.renderRect;
    const cx = Math.max(imgRect.left, Math.min(e.clientX, imgRect.right));
    const cy = Math.max(imgRect.top, Math.min(e.clientY, imgRect.bottom));
    const sx = Math.max(imgRect.left, Math.min(startX, imgRect.right));
    const sy = Math.max(imgRect.top, Math.min(startY, imgRect.bottom));

    const left = Math.min(sx, cx) - imgRect.left;
    const top = Math.min(sy, cy) - imgRect.top;
    const width = Math.abs(cx - sx);
    const height = Math.abs(cy - sy);

    // Minimum selection size
    if (width < 5 || height < 5) {
      selection.style.display = 'none';
      hasSelection = false;
      btnConfirm.disabled = true;
      btnReset.style.display = 'none';
      infoText.textContent = 'Draw a rectangle on the image to select the capture region';
      return;
    }

    // Convert to original image coordinates
    selRect = {
      x: Math.round(left * scaleX),
      y: Math.round(top * scaleY),
      w: Math.round(width * scaleX),
      h: Math.round(height * scaleY),
    };

    hasSelection = true;
    btnConfirm.disabled = false;
    btnReset.style.display = '';
    infoText.innerHTML = `Region: <strong>${selRect.x}, ${selRect.y}</strong> &mdash; <strong>${selRect.w} x ${selRect.h}</strong>`;
  });

  // ── Actions ──
  window.resetSelection = () => {
    selection.style.display = 'none';
    hasSelection = false;
    btnConfirm.disabled = true;
    btnReset.style.display = 'none';
    infoText.textContent = 'Draw a rectangle on the image to select the capture region';
    dimLabel.textContent = '';
  };

  window.submitSelection = async () => {
    if (!hasSelection) return;
    try {
      await window._invoke('save_selected_region', {
        left: selRect.x,
        top: selRect.y,
        width: selRect.w,
        height: selRect.h,
      });
      const win = await window._getCurrentWindow();
      await win.close();
    } catch (e) {
      alert('Failed to save region: ' + e);
    }
  };

  window.cancelSelection = async () => {
    const win = await window._getCurrentWindow();
    await win.close();
  };

  // Handle Escape key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.cancelSelection();
    if (e.key === 'Enter' && hasSelection) window.submitSelection();
  });

  // Handle window resize
  window.addEventListener('resize', updateScale);

  // Start
  init();
</script>

</body>
</html>
